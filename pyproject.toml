[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pantrypilot"
version = "0.1.0"
description = "Pantry Pilot: a coordinator's assistant for community food pantries, built on Strands Agents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Ritwika Kancharla" }]
dependencies = [
    "strands-agents>=1.55.0",
    "strands-agents-tools>=0.8.8",
    "bedrock-agentcore>=1.22.0",
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "boto3",
    "pyyaml",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "httpx", "ruff", "botocore[crt]"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", ".data"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["pantrypilot", "app", "main", "scripted_model"]
