<text x="460.0" y="210.6" font-size="15" text-anchor="middle" dominant-baseline="middle" fill="#343a40">Aisha, busy; taps one</text>
<text x="460.0" y="229.4" font-size="15" text-anchor="middle" dominant-baseline="middle" fill="#343a40">option on a card</text>
