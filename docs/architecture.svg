<rect width="1600" height="1000" fill="#ffffff"/>
<text x="40.0" y="44.0" font-size="34" text-anchor="start" dominant-baseline="middle" fill="#1e1e1e" font-weight="bold">Pantry Pilot  ·  Good Neighbor track</text>
<text x="40.0" y="82.0" font-size="18" text-anchor="start" dominant-baseline="middle" fill="#555">Volunteer shifts, donations and inventory for a small food pantry. A Strands Swarm with handoffs; the human is escalated to as a message, not an interrupt.</text>
