<text x="820.0" y="229.4" font-size="15" text-anchor="middle" dominant-baseline="middle" fill="#343a40">simulate a text · schedule board · weekly brief</text>
<rect x="1180" y="160" width="330" height="90" rx="12" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
