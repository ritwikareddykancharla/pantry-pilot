<text x="1345.0" y="210.6" font-size="15" text-anchor="middle" dominant-baseline="middle" fill="#343a40">scheduler or POST /api/sweep</text>
<text x="1345.0" y="229.4" font-size="15" text-anchor="middle" dominant-baseline="middle" fill="#343a40">POST /api/inbound per text</text>
